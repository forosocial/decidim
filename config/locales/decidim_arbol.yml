ca:
  decidim:
    participatory_processes:
      arbol:
        title: "Arbre del %{process}"
        sin_conflictos: "Sense conflictes"
        sin_propuestas: "Sense propostes encara"
        boton_nueva_propuesta: "Crear proposta per a aquest conflicte"
        desplegar: "Mostrar o amagar el contingut"
        desplegar_todo: "Desplegar-ho tot"
        ayuda_boton: "Com llegir l'arbre"
        ayuda_titulo: "Com llegir l'arbre"
        ayuda_grupo: "Grup de pactes"
        ayuda_pacto: "Pacte"
        ayuda_conflicto: "Conflicte"
        ayuda_propuesta: "Proposta"
        ayuda_pacto_txt: |
          Es mostra lestructura del procés participatiu en forma darbre.
          L'Acord Ecosocial es compon de 2 pactes ecosocials transversals i 10 pactes ecosocials temàtics, que treballen al voltant de 3 elements centrals:
          1) El Pacte inclou la visió (horitzó de futur desitjable que orienta el pacte)
          2) Els Conflictes: tensions estructurals que impedeixen fer la visió del pacte
          3) Les Propostes: propostes per abordar cada conflicte.
        ayuda_conflicto_txt: "- Els botons al costat del títol enllacen a la pàgina del pacte oa les esmenes actives:"
        ayuda_toggle_txt: "- La fletxa de la dreta (▸) desplega el contingut vigent de l'element corresponent; polsada de nou (▾), ho plega."
        ayuda_estados_txt: "- També es pot desplegar el contingut de tots els elements del %{process}:"
        n_conflictos:
          one: "%{count} conflicte"
          other: "%{count} conflictes"
        n_propuestas:
          one: "%{count} proposta"
          other: "%{count} propostes"
        ayuda_cerrar: "Tancar"
        estados:
          consensuada: "En vigor"
          accepted: "Acceptada"
          rejected: "Rebutjada"
          evaluating: "En avaluació"
          not_answered: "Sense resposta"
          withdrawn: "Retirada"
en:
  decidim:
    participatory_processes:
      arbol:
        title: "%{process} tree"
        sin_conflictos: "No conflicts"
        sin_propuestas: "No proposals yet"
        boton_nueva_propuesta: "Create a proposal for this conflict"
        desplegar: "Show or hide the content"
        desplegar_todo: "Expand all"
        ayuda_boton: "How to read the tree"
        ayuda_titulo: "How to read the tree"
        ayuda_grupo: "Agreement groups"
        ayuda_pacto: "Agreement"
        ayuda_conflicto: "Conflict"
        ayuda_propuesta: "Proposal"
        ayuda_pacto_txt: |
          The participatory process is structured as a tree diagram.
          The Ecosocial Agreement comprises two cross-cutting ecosocial pacts and ten thematic ecosocial pacts, which revolve around three core elements:
          1) The Pact includes the vision (a desired future horizon that guides the pact).
          2) Conflicts: structural tensions that hinder the realization of the pact's vision.
          3) Proposals: proposals to address each conflict.
        ayuda_conflicto_txt: "- The buttons next to the title link to the pact page or its active amendments:"
        ayuda_toggle_txt: "- The right arrow (▸) displays the current content of the corresponding item; pressed again (▾), it folds it."
        ayuda_estados_txt: "- The content of all elements of %{process} can also be displayed:"
        n_conflictos:
          one: "%{count} conflict"
          other: "%{count} conflicts"
        n_propuestas:
          one: "%{count} proposal"
          other: "%{count} proposals"
        ayuda_cerrar: "Close"
        estados:
          consensuada: "Currently agreed"
          accepted: "Accepted"
          rejected: "Rejected"
          evaluating: "Under evaluation"
          not_answered: "Not answered"
          withdrawn: "Withdrawn"
es:
  decidim:
    participatory_processes:
      arbol:
        title: "Árbol del %{process}"
        sin_conflictos: "Sin conflictos"
        sin_propuestas: "Sin propuestas todavía"
        boton_nueva_propuesta: "Crear propuesta para este conflicto"
        desplegar: "Mostrar u ocultar el contenido"
        desplegar_todo: "Desplegar todo"
        ayuda_boton: "Cómo leer el árbol"
        ayuda_titulo: "Cómo leer el árbol"
        ayuda_grupo: "Grupo de pactos"
        ayuda_pacto: "Pacto"
        ayuda_conflicto: "Conflicto"
        ayuda_propuesta: "Propuesta"
        ayuda_pacto_txt: | 
          Se muestra la estructura del proceso participativo en forma de árbol.
          El Acuerdo Ecosocial se compone de 2 pactos ecosociales transversales y 10 pactos ecosociales temáticos, que trabajan en torno a 3 elementos centrales:
          1) El Pacto incluye la visión (horizonte de futuro deseable que orienta el pacto)
          2) Los Conflictos: tensiones estructurales que impiden realizar la visión del pacto
          3) Las Propuestas: propuestas para abordar cada conflicto.
        ayuda_conflicto_txt: "- Los botones junto al título enlazan a la página del pacto o a sus enmiendas activas."
        ayuda_toggle_txt: "- La flecha de la derecha (▸) despliega el contenido vigente del elemento correspondiente; pulsada de nuevo (▾), lo pliega."
        ayuda_estados_txt: "- También puede desplegarse el contenido de todos los elementos del %{process}"
        n_conflictos:
          one: "%{count} conflicto"
          other: "%{count} conflictos"
        n_propuestas:
          one: "%{count} propuesta"
          other: "%{count} propuestas"
        ayuda_cerrar: "Cerrar"
        estados:
          consensuada: "En vigor"
          accepted: "Aceptada"
          rejected: "Rechazada"
          evaluating: "En evaluación"
          not_answered: "Sin respuesta"
          withdrawn: "Retirada"
eu:
  decidim:
    participatory_processes:
      arbol:
        title: "%{process} zuhaitza"
        sin_conflictos: "Ez dago gatazkarik"
        sin_propuestas: "Oraindik ez dago proposamenik"
        boton_nueva_propuesta: "Sortu proposamen bat gatazka honetarako"
        desplegar: "Erakutsi edo ezkutatu edukia"
        desplegar_todo: "Zabaldu dena"
        ayuda_boton: "Zuhaitza nola irakurri"
        ayuda_titulo: "Zuhaitza nola irakurri"
        ayuda_grupo: "Akordio-taldeak"
        ayuda_pacto: "Akordioa"
        ayuda_conflicto: "Gatazka"
        ayuda_propuesta: "Proposamena"
        ayuda_pacto_txt: |
          Parte-hartze prozesua zuhaitz diagrama gisa egituratzen da.
          Ekosozial Akordioa bi zeharkako ekosozial itun eta hamar ekosozial itun tematikoz osatuta dago, hiru elementu nagusiren inguruan biratzen direnak:
          1) Itunak ikuspegia barne hartzen du (ituna gidatzen duen etorkizuneko horizonte nahi bat).
          2) Gatazkak: itunaren ikuspegia gauzatzea oztopatzen duten tentsio estrukturalak.
          3) Proposamenak: gatazka bakoitzari aurre egiteko proposamenak.
        ayuda_conflicto_txt: "- Izenburuaren ondoko botoiek itunaren orrialdera edo haren zuzenketa aktiboetara estekatzen dute:"
        ayuda_toggle_txt: "- Eskuineko geziak (▸) dagokion elementuaren uneko edukia erakusten du; berriro sakatuta (▾), tolestu egiten du."
        ayuda_estados_txt: "- %{process}-ren elementu guztien edukia ere bistara daiteke:"
        n_conflictos:
          one: "%{count} gatazka"
          other: "%{count} gatazka"
        n_propuestas:
          one: "%{count} proposamen"
          other: "%{count} proposamen"
        ayuda_cerrar: "Itxi"
        estados:
          consensuada: "Unean ados"
          accepted: "Onartua"
          rejected: "Baztertua"
          evaluating: "Ebaluazioan"
          not_answered: "Erantzunik gabe"
          withdrawn: "Erretiratua"
gl:
  decidim:
    participatory_processes:
      arbol:
        title: "Árbore do %{process}"
        sin_conflictos: "Sen conflitos"
        sin_propuestas: "Sen propostas aínda"
        boton_nueva_propuesta: "Crear proposta para este conflito"
        desplegar: "Mostrar ou agochar o contido"
        desplegar_todo: "Despregar todo"
        ayuda_boton: "Como ler a árbore"
        ayuda_titulo: "Como ler a árbore"
        ayuda_grupo: "Grupo de pactos"
        ayuda_pacto: "Pacto"
        ayuda_conflicto: "Conflito"
        ayuda_propuesta: "Proposta"
        ayuda_pacto_txt: |
          O proceso participativo estrutúrase como un diagrama de árbore.
          O Acordo Ecosocial comprende dous pactos ecosociais transversais e dez pactos ecosociais temáticos, que xiran arredor de tres elementos centrais:
          1) O Pacto inclúe a visión (un horizonte de futuro desexado que guía o pacto).
          2) Conflitos: tensións estruturais que dificultan a realización da visión do pacto.
          3) Propostas: propostas para abordar cada conflito.
        ayuda_conflicto_txt: "- Os botóns xunto ao título ligan á páxina do pacto ou ás súas emendas activas:"
        ayuda_toggle_txt: "- A frecha cara á dereita (▸) mostra o contido actual do elemento correspondente; se se preme de novo (▾), pregase."
        ayuda_estados_txt: "- Tamén se pode mostrar o contido de todos os elementos de %{process}:"
        n_conflictos:
          one: "%{count} conflito"
          other: "%{count} conflitos"
        n_propuestas:
          one: "%{count} proposta"
          other: "%{count} propostas"
        ayuda_cerrar: "Pechar"
        estados:
          consensuada: "En vigor"
          accepted: "Aceptada"
          rejected: "Rexeitada"
          evaluating: "En avaliación"
          not_answered: "Sen resposta"
          withdrawn: "Retirada"
